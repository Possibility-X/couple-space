services:
  backend:
    build: ./backend
    container_name: couple-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      ANNIVERSARY_DATE: ${ANNIVERSARY_DATE}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/db:/app/data/db
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/auth/setup-status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - couple-net

  nginx:
    build: ./frontend
    container_name: couple-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/uploads:/data/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - couple-net

networks:
  couple-net:
    driver: bridge
